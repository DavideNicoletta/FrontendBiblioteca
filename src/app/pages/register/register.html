<div style="width: 300px;
  margin: 0 auto; padding-top: 50px;">

<h2>Registrati</h2>

<form (ngSubmit)="submit()">
  <input name="username" [(ngModel)]="username" placeholder="Username" required  class="form-control"/>
  <input name="email" type="email" [(ngModel)]="email" placeholder="Email" required  class="form-control"/>
  <input name="password" type="password" [(ngModel)]="password" placeholder="Password" required  class="form-control"/>
  <button type="submit" class="btn btn-primary">Crea account</button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}
</div>
