<h2>Gestione libri</h2>

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

<form class="row g-2 mb-4" (ngSubmit)="save()">
  <div class="col-md-3">
    <label class="form-label" for="title">Titolo</label>
    <input id="title" class="form-control" name="title" [(ngModel)]="form.title" required />
  </div>
  <div class="col-md-2">
    <label class="form-label" for="author">Autore</label>
    <input id="author" class="form-control" name="author" [(ngModel)]="form.author" required />
  </div>
  <div class="col-md-2">
    <label class="form-label" for="isbn">ISBN</label>
    <input id="isbn" class="form-control" name="isbn" [(ngModel)]="form.isbn" required />
  </div>
  <div class="col-md-1">
    <label class="form-label" for="price">Prezzo</label>
    <input id="price" class="form-control" name="price" type="number" step="0.01" [(ngModel)]="form.price" required />
  </div>
  <div class="col-md-1">
    <label class="form-label" for="copies">Copie</label>
    <input id="copies" class="form-control" name="copies" type="number" [(ngModel)]="form.availableCopies" required />
  </div>
  <div class="col-md-3 d-flex align-items-end gap-2">
    <button type="submit" class="btn btn-primary">{{ editingUuid ? 'Aggiorna' : 'Aggiungi' }}</button>
    @if (editingUuid) {
      <button type="button" class="btn btn-secondary" (click)="reset()">Annulla</button>
    }
  </div>
</form>

<table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">Titolo</th>
      <th scope="col">Autore</th>
      <th scope="col">ISBN</th>
      <th scope="col">Prezzo</th>
      <th scope="col">Copie</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    @for (b of books(); track b.uuid) {
      <tr>
        <td>{{ b.title }}</td>
        <td>{{ b.author }}</td>
        <td>{{ b.isbn }}</td>
        <td>{{ b.price }}</td>
        <td>{{ b.availableCopies }}</td>
       <td class="text-end">
          <button class="btn btn-warning btn-sm me-1" (click)="edit(b)" title="Modifica" aria-label="Modifica">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-outline-danger btn-sm" (click)="remove(b)" title="Elimina" aria-label="Elimina">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
